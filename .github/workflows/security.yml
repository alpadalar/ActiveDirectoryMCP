name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly: new CVEs turn the audit red over time without any code change.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked --all-extras

      - name: bandit (medium severity and above, gating)
        run: uv run bandit -c pyproject.toml -r src -ll

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked --all-extras

      # uv venvs ship without pip; the pip-audit action's virtualenv mode needs it.
      - name: Install pip into the venv
        run: uv pip install --python .venv/bin/python pip

      # Advisory by design (new upstream CVEs must not block unrelated PRs).
      # PROMOTE TO GATE (delete `continue-on-error`) once this job has been
      # green on at least four consecutive weekly scheduled runs and no
      # `ignore-vulns` entries remain.
      - name: pip-audit (advisory)
        continue-on-error: true
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: ".venv"
          summary: true

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: activedirectorymcp:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: activedirectorymcp:ci-scan
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so secrets removed from the tip are still caught.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Image pinned by OCI index digest (a tag is mutable). Re-verify with:
      #   docker buildx imagetools inspect zricethezav/gitleaks:v8.30.1
      - name: gitleaks full-history scan
        run: |
          docker run --rm -v "$(pwd):/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo -c /repo/.gitleaks.toml --no-color -v
