name: Release

# Publishes to GHCR only on a v* tag push or a non-dry-run dispatch from a tag.
# Never triggered by PR events.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true builds linux/amd64 and linux/arm64 without pushing; false pushes (must be run from a tag)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse non-dry-run dispatch from a non-tag ref
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref_type != 'tag'
        run: |
          echo "::error::A non-dry-run dispatch must be started from a v* tag, not ${GITHUB_REF}"
          exit 1

      - name: Verify tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version v${VERSION}"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is a lowercase literal: the repo name has capitals and
      # registries reject them. No branch-based tag type: on tag pushes it
      # yields an invalid "-<sha>" tag. :latest only moves on tag pushes, so a
      # dispatch can never roll it back.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/alpadalar/activedirectorymcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: latest=${{ github.event_name == 'push' && 'auto' || 'false' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
