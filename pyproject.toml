[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "active-directory-mcp"
version = "1.0.0"
description = "A Model Context Protocol server for interacting with Active Directory"
requires-python = ">=3.11"
authors = [
    {name = "Alperen Adalar", email = "alp.adalar@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["active-directory", "mcp", "ldap", "ad", "authentication", "directory-services"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking :: Authentication",
]

dependencies = [
    "mcp>=1.28,<2",
    "fastmcp>=3.2,<4",
    "uvicorn>=0.40,<1",
    "starlette>=1.0,<2",
    "ldap3>=2.9.1,<3.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.15.0,<2.0.0",
    "azure-keyvault-secrets>=4.7.0,<5.0.0",
]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "mypy>=1.17,<2",
    "requests>=2.31.0,<3.0.0",
    "types-requests>=2.31.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/alpadalar/ActiveDirectoryMCP"
Documentation = "https://github.com/alpadalar/ActiveDirectoryMCP#readme"
Repository = "https://github.com/alpadalar/ActiveDirectoryMCP.git"
Issues = "https://github.com/alpadalar/ActiveDirectoryMCP/issues"

[project.scripts]
activedirectory-mcp = "active_directory_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--tb=short",
    "--strict-markers",
    "-m", "not integration",
]
markers = [
    "integration: requires a live LDAP server; deselected by default; run with -m integration",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyasn1.*",
    "ignore::DeprecationWarning:ldap3.*",
    "ignore::UserWarning:pydantic.*",
    "ignore::FutureWarning",
    "ignore::PendingDeprecationWarning"
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true


[tool.coverage.run]
source = ["src/active_directory_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit set pins behavior across ruff default changes. No rule is ignored globally and
# no per-file-ignores exist: every finding was fixed in code (no noqa suppressions remain).
select = ["E", "F", "B", "I"]
ignore = []
