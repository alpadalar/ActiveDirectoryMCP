# Local OpenLDAP lab for the integration tests (osixia/openldap, RFC2307bis,
# inetOrgPerson / groupOfNames schema).
#
# This is NOT Active Directory and NOT Samba AD. It does not enforce
# userAccountControl semantics, unicodePwd TLS rules, lastLogon replication or
# AD ACLs, so green tests here do not prove AD behaviour.
#
# Usage (any throwaway value): LAB_LDAP_PASSWORD=<value> docker compose -f docker-compose-openldap.yml up -d openldap
# (scripts/run_tests_with_ldap.sh does this with a per-run random password.)

services:
  openldap:
    image: osixia/openldap:latest
    container_name: openldap-lab
    hostname: dc
    domainname: test.local
    environment:
      LDAP_ORGANISATION: "Test Organization"
      LDAP_DOMAIN: "test.local"
      LDAP_ADMIN_PASSWORD: "${LAB_LDAP_PASSWORD:?set LAB_LDAP_PASSWORD (any throwaway value) before starting the lab}"
      LDAP_CONFIG_PASSWORD: "${LAB_LDAP_PASSWORD:?set LAB_LDAP_PASSWORD (any throwaway value) before starting the lab}"
      LDAP_READONLY_USER: "false"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "false"
      LDAP_REPLICATION: "false"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
      - ./ldap-init:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: ["--copy-service"]
    networks:
      ad-network:
        ipv4_address: 192.168.1.100
    restart: unless-stopped

  # ActiveDirectory MCP Server for testing
  activedirectory-mcp:
    build: .
    container_name: activedirectory-mcp-test
    depends_on:
      - openldap
    environment:
      - AD_MCP_CONFIG=/app/ad-config/openldap-lab.example.json
      # Throwaway lab credential for the local openldap container above; the lab config
      # references it as ${LAB_LDAP_PASSWORD}. Never do this for production - use Azure
      # Key Vault instead (see docker-compose.yml).
      - LAB_LDAP_PASSWORD=${LAB_LDAP_PASSWORD:?set LAB_LDAP_PASSWORD (any throwaway value) before starting the lab}
      # API key for the HTTP transport. The server refuses to start without one, so set it
      # before starting the activedirectory-mcp service (the openldap service alone does not need it).
      - AD_MCP_HTTP_API_KEY=${AD_MCP_HTTP_API_KEY:-}
    ports:
      - "8813:8813"
    volumes:
      - ./ad-config:/app/ad-config:ro
    networks:
      - ad-network
    restart: unless-stopped

  # phpLDAPadmin for web management
  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    container_name: openldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      - openldap
    networks:
      - ad-network

volumes:
  openldap-data:
  openldap-config:

networks:
  ad-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
